---
- name: Configure Webservers
  hosts: webservers
  become: true

  tasks:
    - name: Install Apache
      yum:
        name: httpd
        state: present

    - name: Ensure Apache is running
      service:
        name: httpd
        state: started
        enabled: true

    - name: Copy a sample index.html
      copy:
        dest: /var/www/html/index.html
        content: "Welcome to Group1 Dev Webserver {{ inventory_hostname }}"